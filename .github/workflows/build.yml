name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'mac-v*'
      - 'win-v*'

jobs:
  build-mac:
    name: macOS Apple Silicon (arm64)
    runs-on: macos-latest
    if: "!startsWith(github.ref_name, 'win-')"
    steps:
      - uses: actions/checkout@v4

      - name: Prepare build metadata
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          BUILD_NUMBER=$(printf '%s' "$TAG_NAME" | sed -n 's/^\(mac-\)\{0,1\}v1\.0-build\([0-9][0-9]*\)$/\2/p')
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          fi
          printf 'VERSION = "1.0"\nBUILD_NUMBER = "%s"\nRELEASE_TAG = "%s"\n' "$BUILD_NUMBER" "$TAG_NAME" > build_info.py

      - name: Create icon
        run: |
          ICON_ICNS="$RUNNER_TEMP/RimeoAgent.icns"
          cp rimeo1024-bigsur.icns "$ICON_ICNS"
          echo "ICON_ICNS=$ICON_ICNS" >> "$GITHUB_ENV"

      - name: Build macOS app (Universal — arm64 + x86_64)
        run: |
          cd macos_arm64
          swift build -c release --arch arm64 --arch x86_64

          UNIVERSAL="$PWD/.build/apple/Products/Release/RimeoAgent"
          HELPER="$PWD/.build/apple/Products/Release/RekordboxDBHelper"
          SQLCIPHER_FRAMEWORK="$PWD/.build/artifacts/sqlcipher.swift/SQLCipher/SQLCipher.xcframework/macos-arm64_x86_64/SQLCipher.framework"
          if [ ! -f "$UNIVERSAL" ]; then
            echo "ERROR: universal binary not found at $UNIVERSAL"
            exit 1
          fi
          if [ ! -f "$HELPER" ]; then
            echo "ERROR: helper binary not found at $HELPER"
            exit 1
          fi
          if [ ! -d "$SQLCIPHER_FRAMEWORK" ]; then
            echo "ERROR: SQLCipher.framework not found at $SQLCIPHER_FRAMEWORK"
            exit 1
          fi
          echo "Universal archs: $(lipo -archs "$UNIVERSAL")"
          echo "Helper archs: $(lipo -archs "$HELPER")"

          APP="$GITHUB_WORKSPACE/dist/RimeoAgent.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$APP/Contents/Frameworks"
          cp "$UNIVERSAL" "$APP/Contents/MacOS/RimeoAgent"
          chmod +x "$APP/Contents/MacOS/RimeoAgent"
          cp "$HELPER" "$APP/Contents/MacOS/rbdb-helper"
          chmod +x "$APP/Contents/MacOS/rbdb-helper"
          cp -R "$SQLCIPHER_FRAMEWORK" "$APP/Contents/Frameworks/SQLCipher.framework"
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$APP/Contents/MacOS/rbdb-helper"
          cp build/Info.plist "$APP/Contents/Info.plist"
          cp "$ICON_ICNS" "$APP/Contents/Resources/RimeoAgent.icns"
          cp "$GITHUB_WORKSPACE/build_info.py" "$APP/Contents/Resources/build_info.py"
          cp "$GITHUB_WORKSPACE/similarity_config.json" "$APP/Contents/Resources/similarity_config.json"

      - name: Sign macOS app
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "::error::MACOS_CERT_P12 secret not set — refusing to ship an adhoc-signed build (FDA would reset on every update)"
            exit 1
          fi
          ID="Rimeo Self-Signed"
          APP="$GITHUB_WORKSPACE/dist/RimeoAgent.app"
          CERT_P12="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$MACOS_CERT_P12" | base64 --decode > "$CERT_P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_P12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          FW="$APP/Contents/Frameworks/SQLCipher.framework"
          if [ -d "$FW" ] && [ ! -L "$FW/SQLCipher" ]; then
            ( cd "$FW"
              rm -rf Headers Modules Resources SQLCipher Versions/Current
              ln -s A Versions/Current
              [ -e Versions/Current/Headers ]   && ln -s Versions/Current/Headers Headers   || true
              [ -e Versions/Current/Modules ]   && ln -s Versions/Current/Modules Modules   || true
              [ -e Versions/Current/Resources ] && ln -s Versions/Current/Resources Resources || true
              ln -s Versions/Current/SQLCipher SQLCipher )
          fi
          [ -d "$FW" ] && codesign --force --sign "$ID" "$FW/Versions/A"
          codesign --force --sign "$ID" "$APP/Contents/MacOS/rbdb-helper"
          codesign --force --sign "$ID" "$APP/Contents/MacOS/RimeoAgent"
          codesign --force --sign "$ID" --identifier app.rimeo.agent "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "Identifier|Authority|Sealed"

      - name: Package
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent RimeoAgent.app RimeoAgent_mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/RimeoAgent_mac.zip

  build-windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-2022
    if: "!startsWith(github.ref_name, 'mac-')"
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            arch: x64
            zip: RimeoAgent_win.zip
            setup: RimeoAgentSetup_win.exe
          - rid: win-arm64
            arch: arm64
            zip: RimeoAgent_win-arm64.zip
            setup: RimeoAgentSetup_win-arm64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare build metadata
        shell: pwsh
        run: |
          $tagName = $env:GITHUB_REF_NAME
          $buildNumber = [regex]::Match($tagName, '^(win-)?v1\.0-build(\d+)$').Groups[2].Value
          if ([string]::IsNullOrWhiteSpace($buildNumber)) {
            $buildNumber = $env:GITHUB_RUN_NUMBER
          }
          "VERSION = `"1.0`"`nBUILD_NUMBER = `"$buildNumber`"`nRELEASE_TAG = `"$tagName`"" | Set-Content -Path build_info.py -Encoding utf8

      - name: Create icon
        shell: pwsh
        run: |
          python -m pip install pillow --quiet
          python -c "from PIL import Image; img=Image.open('rimeo1024-bigsur.icns').convert('RGBA'); img.save(r'windows_csharp\RimeoAgent\Assets\rimeo.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Show .NET environment
        shell: pwsh
        working-directory: windows_csharp
        run: |
          dotnet --info
          dotnet --list-sdks

      - name: Restore
        shell: pwsh
        working-directory: windows_csharp
        run: |
          dotnet restore RimeoAgent/RimeoAgent.csproj `
            -r ${{ matrix.rid }}

      - name: Publish
        shell: pwsh
        working-directory: windows_csharp
        run: |
          dotnet publish RimeoAgent/RimeoAgent.csproj `
            -c Release `
            -r ${{ matrix.rid }} `
            --no-restore `
            --self-contained true `
            -o ..\dist\RimeoAgent

      - name: Ensure resources.pri in publish output
        shell: pwsh
        working-directory: windows_csharp
        run: |
          # WinUI 3 unpackaged WITHOUT <EnableMsixTooling>: the app's merged PRI is
          # emitted as "RimeoAgent.pri" (= ProjectName.pri), but the WinUI runtime
          # looks for "resources.pri". Missing/misnamed -> ms-appx:///Views/*.xaml
          # cannot resolve and every XAML page load throws FileNotFoundException
          # (~10s crash). Fix: copy the app PRI to resources.pri.
          $dist   = "..\dist\RimeoAgent"
          $target = Join-Path $dist "resources.pri"
          if (-not (Test-Path $target)) {
            Write-Host "resources.pri missing — searching for the app PRI (ProjectName.pri)..."
            $candidates = Get-ChildItem -Path $dist, RimeoAgent\bin, RimeoAgent\obj -Recurse -Filter *.pri -ErrorAction SilentlyContinue |
                          Where-Object { $_.Name -notmatch '^Microsoft\.' } |
                          Sort-Object LastWriteTime -Descending
            $src = $candidates | Where-Object { $_.Name -ieq 'RimeoAgent.pri' } | Select-Object -First 1
            if (-not $src) { $src = $candidates | Select-Object -First 1 }
            if ($src) {
              Copy-Item $src.FullName $target -Force
              Write-Host "Copied $($src.FullName) -> resources.pri"
            }
          }
          if (-not (Test-Path $target)) {
            Write-Host "No app PRI found. All .pri files present:"
            Get-ChildItem -Path $dist, RimeoAgent\bin, RimeoAgent\obj -Recurse -Filter *.pri -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "  $($_.FullName)" }
            Write-Error "App resources.pri / RimeoAgent.pri not found — XAML pages would fail to load. Failing the build."
            exit 1
          }
          Write-Host "resources.pri present ($((Get-Item $target).Length) bytes)"

      - name: Dump XAML compiler diagnostics
        if: failure()
        shell: pwsh
        working-directory: windows_csharp
        run: |
          Get-ChildItem -Path RimeoAgent\obj -Recurse -Include input.json,output.json,*.xr.xml,*.log -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "===== $($_.FullName) ====="
              Get-Content $_.FullName -ErrorAction SilentlyContinue
            }

      - name: Verify self-contained WinUI native DLLs
        shell: pwsh
        run: |
          $dist = "dist\RimeoAgent"
          $required = @(
            "Microsoft.ui.xaml.dll",
            "Microsoft.WindowsAppRuntime.Bootstrap.dll",
            "Microsoft.WindowsAppRuntime.dll"
          )
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $dist $_)) }
          if ($missing) {
            Write-Error "Self-contained WinUI runtime DLLs missing (WindowsAppSDKSelfContained did not take effect): $($missing -join ', ')"
            exit 1
          }
          Write-Host "Self-contained WinUI runtime present for ${{ matrix.rid }}"

      - name: Bundle cloudflared
        shell: pwsh
        run: |
          # The server's component manifest (/api/agent/runtime) can 400, leaving the
          # agent without cloudflared and therefore without a named tunnel (no cloud
          # audio). Bundle cloudflared next to the exe so it's always available;
          # TunnelManager.FindCloudflared() looks here first. The amd64 build also
          # runs on Windows-on-ARM under emulation, so it covers both RIDs.
          $url = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          Invoke-WebRequest $url -OutFile "dist\RimeoAgent\cloudflared.exe" -UseBasicParsing
          $sz = (Get-Item "dist\RimeoAgent\cloudflared.exe").Length
          Write-Host "Bundled cloudflared.exe ($sz bytes)"
          if ($sz -lt 1000000) { Write-Error "cloudflared.exe looks too small ($sz bytes)"; exit 1 }

      - name: Copy build_info
        shell: pwsh
        run: Copy-Item build_info.py dist\RimeoAgent\build_info.py

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist\RimeoAgent\* -DestinationPath "dist\${{ matrix.zip }}" -Force

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          makensis `
            "/DSOURCE_DIR=$PWD\dist\RimeoAgent" `
            "/DOUT_FILE=$PWD\dist\${{ matrix.setup }}" `
            windows_csharp\build\RimeoAgentInstaller.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist\${{ matrix.setup }}
            dist\${{ matrix.zip }}

  release:
    name: Attach to Release
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    if: "always() && startsWith(github.ref, 'refs/tags/') && (needs.build-mac.result == 'success' || needs.build-windows.result == 'success')"
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release title
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          BUILD_NUMBER=$(printf '%s' "$TAG_NAME" | sed -n 's/^\(mac-\|win-\)\{0,1\}v1\.0-build\([0-9][0-9]*\)$/\2/p')
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          fi
          echo "RELEASE_NAME=Release v1.0 (${BUILD_NUMBER})" >> "$GITHUB_ENV"
          echo "MAC_ONLY=$( [[ '${{ github.ref_name }}' == mac-* ]] && echo true || echo false )" >> "$GITHUB_ENV"
          echo "WIN_ONLY=$( [[ '${{ github.ref_name }}' == win-* ]] && echo true || echo false )" >> "$GITHUB_ENV"

      - name: Upload to release (macOS + Windows)
        if: env.MAC_ONLY == 'false' && env.WIN_ONLY == 'false'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          files: |
            artifacts/mac/RimeoAgent_mac.zip
            artifacts/windows-x64/RimeoAgentSetup_win.exe
            artifacts/windows-x64/RimeoAgent_win.zip
            artifacts/windows-arm64/RimeoAgentSetup_win-arm64.exe
            artifacts/windows-arm64/RimeoAgent_win-arm64.zip

      - name: Upload to release (macOS only)
        if: env.MAC_ONLY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          files: |
            artifacts/mac/RimeoAgent_mac.zip

      - name: Upload to release (Windows only)
        if: env.WIN_ONLY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          files: |
            artifacts/windows-x64/RimeoAgentSetup_win.exe
            artifacts/windows-x64/RimeoAgent_win.zip
            artifacts/windows-arm64/RimeoAgentSetup_win-arm64.exe
            artifacts/windows-arm64/RimeoAgent_win-arm64.zip
