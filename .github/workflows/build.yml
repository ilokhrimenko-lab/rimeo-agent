name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'mac-v*'
      - 'win-v*'

jobs:
  build-mac:
    name: macOS Apple Silicon (arm64)
    runs-on: macos-latest
    if: "!startsWith(github.ref_name, 'win-')"
    steps:
      - uses: actions/checkout@v4

      - name: Prepare build metadata
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          BUILD_NUMBER=$(printf '%s' "$TAG_NAME" | sed -n 's/^\(mac-\)\{0,1\}v1\.0-build\([0-9][0-9]*\)$/\2/p')
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          fi
          printf 'VERSION = "1.0"\nBUILD_NUMBER = "%s"\nRELEASE_TAG = "%s"\n' "$BUILD_NUMBER" "$TAG_NAME" > build_info.py

      - name: Create icon
        run: |
          ICON_ICNS="$RUNNER_TEMP/RimeoAgent.icns"
          cp rimeo1024-bigsur.icns "$ICON_ICNS"
          echo "ICON_ICNS=$ICON_ICNS" >> "$GITHUB_ENV"

      - name: Build macOS app (Universal — arm64 + x86_64)
        run: |
          cd macos_arm64
          swift build -c release --arch arm64 --arch x86_64

          UNIVERSAL="$PWD/.build/apple/Products/Release/RimeoAgent"
          HELPER="$PWD/.build/apple/Products/Release/RekordboxDBHelper"
          SQLCIPHER_FRAMEWORK="$PWD/.build/artifacts/sqlcipher.swift/SQLCipher/SQLCipher.xcframework/macos-arm64_x86_64/SQLCipher.framework"
          if [ ! -f "$UNIVERSAL" ]; then
            echo "ERROR: universal binary not found at $UNIVERSAL"
            exit 1
          fi
          if [ ! -f "$HELPER" ]; then
            echo "ERROR: helper binary not found at $HELPER"
            exit 1
          fi
          if [ ! -d "$SQLCIPHER_FRAMEWORK" ]; then
            echo "ERROR: SQLCipher.framework not found at $SQLCIPHER_FRAMEWORK"
            exit 1
          fi
          echo "Universal archs: $(lipo -archs "$UNIVERSAL")"
          echo "Helper archs: $(lipo -archs "$HELPER")"

          APP="$GITHUB_WORKSPACE/dist/RimeoAgent.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$APP/Contents/Frameworks"
          cp "$UNIVERSAL" "$APP/Contents/MacOS/RimeoAgent"
          chmod +x "$APP/Contents/MacOS/RimeoAgent"
          cp "$HELPER" "$APP/Contents/MacOS/rbdb-helper"
          chmod +x "$APP/Contents/MacOS/rbdb-helper"
          cp -R "$SQLCIPHER_FRAMEWORK" "$APP/Contents/Frameworks/SQLCipher.framework"
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$APP/Contents/MacOS/rbdb-helper"
          cp build/Info.plist "$APP/Contents/Info.plist"
          cp "$ICON_ICNS" "$APP/Contents/Resources/RimeoAgent.icns"
          cp "$GITHUB_WORKSPACE/build_info.py" "$APP/Contents/Resources/build_info.py"
          cp "$GITHUB_WORKSPACE/similarity_config.json" "$APP/Contents/Resources/similarity_config.json"

      - name: Sign macOS app
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "::error::MACOS_CERT_P12 secret not set — refusing to ship an adhoc-signed build (FDA would reset on every update)"
            exit 1
          fi
          ID="Rimeo Self-Signed"
          APP="$GITHUB_WORKSPACE/dist/RimeoAgent.app"
          CERT_P12="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$MACOS_CERT_P12" | base64 --decode > "$CERT_P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_P12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          FW="$APP/Contents/Frameworks/SQLCipher.framework"
          if [ -d "$FW" ] && [ ! -L "$FW/SQLCipher" ]; then
            ( cd "$FW"
              rm -rf Headers Modules Resources SQLCipher Versions/Current
              ln -s A Versions/Current
              [ -e Versions/Current/Headers ]   && ln -s Versions/Current/Headers Headers   || true
              [ -e Versions/Current/Modules ]   && ln -s Versions/Current/Modules Modules   || true
              [ -e Versions/Current/Resources ] && ln -s Versions/Current/Resources Resources || true
              ln -s Versions/Current/SQLCipher SQLCipher )
          fi
          [ -d "$FW" ] && codesign --force --sign "$ID" "$FW/Versions/A"
          codesign --force --sign "$ID" "$APP/Contents/MacOS/rbdb-helper"
          codesign --force --sign "$ID" "$APP/Contents/MacOS/RimeoAgent"
          codesign --force --sign "$ID" --identifier app.rimeo.agent "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "Identifier|Authority|Sealed"

      - name: Package
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent RimeoAgent.app RimeoAgent_mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/RimeoAgent_mac.zip

  build-windows:
    name: Windows (x86_64)
    runs-on: windows-2022
    if: "!startsWith(github.ref_name, 'mac-')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare build metadata
        shell: pwsh
        run: |
          $tagName = $env:GITHUB_REF_NAME
          $buildNumber = [regex]::Match($tagName, '^(win-)?v1\.0-build(\d+)$').Groups[2].Value
          if ([string]::IsNullOrWhiteSpace($buildNumber)) {
            $buildNumber = $env:GITHUB_RUN_NUMBER
          }
          "VERSION = `"1.0`"`nBUILD_NUMBER = `"$buildNumber`"`nRELEASE_TAG = `"$tagName`"" | Set-Content -Path build_info.py -Encoding utf8

      - name: Create icon
        shell: pwsh
        run: |
          python -m pip install pillow --quiet
          python -c "from PIL import Image; img=Image.open('rimeo1024-bigsur.icns').convert('RGBA'); img.save(r'windows_csharp\RimeoAgent\Assets\rimeo.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Show .NET environment
        shell: pwsh
        working-directory: windows_csharp
        run: |
          dotnet --info
          dotnet --list-sdks

      - name: Restore
        shell: pwsh
        working-directory: windows_csharp
        run: |
          dotnet restore RimeoAgent/RimeoAgent.csproj `
            -r win-x64

      - name: Publish
        shell: pwsh
        working-directory: windows_csharp
        run: |
          dotnet publish RimeoAgent/RimeoAgent.csproj `
            -c Release `
            -r win-x64 `
            --no-restore `
            --self-contained true `
            -o ..\dist\RimeoAgent

      - name: Dump XAML compiler diagnostics
        if: failure()
        shell: pwsh
        working-directory: windows_csharp
        run: |
          Get-ChildItem -Path RimeoAgent\obj -Recurse -Include input.json,output.json,*.xr.xml,*.log -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "===== $($_.FullName) ====="
              Get-Content $_.FullName -ErrorAction SilentlyContinue
            }

      - name: Copy build_info
        shell: pwsh
        run: Copy-Item build_info.py dist\RimeoAgent\build_info.py

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist\RimeoAgent\* -DestinationPath dist\RimeoAgent_win.zip -Force

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          makensis `
            "/DSOURCE_DIR=$PWD\dist\RimeoAgent" `
            "/DOUT_FILE=$PWD\dist\RimeoAgentSetup_win.exe" `
            windows_csharp\build\RimeoAgentInstaller.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist\RimeoAgentSetup_win.exe
            dist\RimeoAgent_win.zip

  release:
    name: Attach to Release
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    if: "always() && startsWith(github.ref, 'refs/tags/') && (needs.build-mac.result == 'success' || needs.build-windows.result == 'success')"
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release title
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          BUILD_NUMBER=$(printf '%s' "$TAG_NAME" | sed -n 's/^\(mac-\|win-\)\{0,1\}v1\.0-build\([0-9][0-9]*\)$/\2/p')
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          fi
          echo "RELEASE_NAME=Release v1.0 (${BUILD_NUMBER})" >> "$GITHUB_ENV"
          echo "MAC_ONLY=$( [[ '${{ github.ref_name }}' == mac-* ]] && echo true || echo false )" >> "$GITHUB_ENV"
          echo "WIN_ONLY=$( [[ '${{ github.ref_name }}' == win-* ]] && echo true || echo false )" >> "$GITHUB_ENV"

      - name: Upload to release (macOS + Windows)
        if: env.MAC_ONLY == 'false' && env.WIN_ONLY == 'false'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          files: |
            artifacts/mac/RimeoAgent_mac.zip
            artifacts/windows/RimeoAgentSetup_win.exe
            artifacts/windows/RimeoAgent_win.zip

      - name: Upload to release (macOS only)
        if: env.MAC_ONLY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          files: |
            artifacts/mac/RimeoAgent_mac.zip

      - name: Upload to release (Windows only)
        if: env.WIN_ONLY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          files: |
            artifacts/windows/RimeoAgentSetup_win.exe
            artifacts/windows/RimeoAgent_win.zip
